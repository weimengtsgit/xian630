# agent-square 主 nginx 配置（含 njs 模块，提供 /api/apps 运行时应用接口）
# 照搬线上捕获配置 docs/online-18016/nginx-T.txt。
# load_module 依赖镜像内 /usr/lib/nginx/modules/ngx_http_js_module.so
# （由 runtime 基镜像 localhost/nginx-njs:1.31 提供，源自工厂 nginx/1.31.2 镜像）。
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
