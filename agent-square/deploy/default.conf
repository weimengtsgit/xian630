# agent-square server 块：静态前端 + njs /api/apps 运行时应用接口 + SPA 回退
# 源自线上捕获配置 docs/online-18016/nginx-T.txt 的 conf.d 段。
js_import ops from /etc/nginx/ops-store-api.js;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # 运行时应用读写接口（光鱼等动态注册的智能体）
    location = /api/apps {
        js_content ops.apps;
    }

    location ~ ^/api/apps/.+ {
        js_content ops.apps;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "OK";
    }
}
