# 航母母港潮汐出港窗口监测看板 — nginx 配置
# 静态资源 + 外部公开数据 API 同源反向代理（浏览器 JS 不直连外部域，规避 CORS）。
# 所有 proxy_pass 使用变量 + 命名捕获：DNS 解析延迟到请求期，容器 DNS 暂时不可达时 nginx 仍可启动。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # NOAA CO-OPS 潮汐预测 API（免鉴权公开接口）
    # /api/noaa/<path> → https://api.tidesandcurrents.noaa.gov/<path>
    location ~ ^/api/noaa/(?<noaa_path>.*)$ {
        set $noaa_upstream api.tidesandcurrents.noaa.gov;
        proxy_pass https://$noaa_upstream/$noaa_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host api.tidesandcurrents.noaa.gov;
        proxy_set_header Accept "application/json";
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # JCG 日本海上保安厅潮汐推算（免鉴权公开页面）
    # /api/jcg/<path> → https://www1.kaiho.mlit.go.jp/TIDE/pred2/<path>
    location ~ ^/api/jcg/(?<jcg_path>.*)$ {
        set $jcg_upstream www1.kaiho.mlit.go.jp;
        proxy_pass https://$jcg_upstream/TIDE/pred2/$jcg_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host www1.kaiho.mlit.go.jp;
        proxy_set_header Accept "text/html,application/xhtml+xml";
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
