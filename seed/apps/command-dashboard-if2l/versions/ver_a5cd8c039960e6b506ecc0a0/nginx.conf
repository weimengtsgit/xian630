# 全球海域舰船目击社媒监控 · 静态应用 nginx 配置
# 说明：本应用为 mock_data 演示口径，运行时零外网请求（演示数据本地内置，
# 地图底图与世界轮廓为本地打包资产），因此不需要任何外部反向代理。
#
# live 预留说明（不在本次演示口径启用）：未来切换真实数据源时，需在
# server-side 网关层补充对 X API v2 recent search 与 Instagram Graph API 的
# 反向代理（含鉴权凭证注入与限流），浏览器 JS 一律走同源 /api/ 路径，
# 不得直连外部平台域名。启用时应使用 nginx 变量 + resolver 的 proxy_pass
# 写法，避免容器 DNS 不可达导致 nginx 启动失败。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
