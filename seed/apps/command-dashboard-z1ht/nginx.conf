# 美海军航母甲板风起降条件评估 · nginx 配置
# 职责：1) 托管 Vite 静态产物；2) 同源反向代理外部公开数据源，规避浏览器 CORS；
#       3) 本体 DaaS 鉴权头仅在服务端注入，令牌不进入浏览器与前端构建产物。
# 所有 proxy_pass 均使用变量 + resolver，DNS 解析延迟到请求期，
# 避免容器 DNS 暂时不可达时 nginx 启动即崩溃（[emerg] host not found in upstream）。
# 本文件不引用任何环境变量或未定义 nginx 变量，可直接启动。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 运行期 DNS 解析（Podman/Docker 环境均可启动）
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 公开格点风场（Open-Meteo GFS / best_match，免鉴权）
    # 浏览器请求 /api/wind/v1/gfs?... → https://api.open-meteo.com/v1/gfs?...
    location /api/wind/ {
        set $wind_upstream api.open-meteo.com;
        proxy_pass https://$wind_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host api.open-meteo.com;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    # 本体 DaaS 航母位置库（鉴权头服务端注入，浏览器永不接触令牌）
    # 浏览器请求 /api/ontology/daasDMS/entity/... → http://ceshi.projects.bingosoft.net:8081/daasDMS/entity/...
    location /api/ontology/ {
        set $ontology_upstream ceshi.projects.bingosoft.net;
        proxy_pass http://$ontology_upstream:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host ceshi.projects.bingosoft.net;
        proxy_set_header Authorization "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJCaW5nb1NvZnQiLCJhdWQiOiJCaW5nb1NvZnQiLCJzdWIiOiJEYWFzIiwiaWF0IjoxNzgwNzQwMzc3LCJleHAiOjE3ODEzNDUxNzcsImFjY2Vzc0tleSI6IkZFNEEwRDEyQzQ5Qjc3NTgxMjNGIn0.BlOLX9QGChwgEEWDTZPwjAR1ej9CacJHWRlefMi82t8";
        proxy_set_header Spaceid "733b385695ae43eb9ee54ef9f4a9507a";
        proxy_set_header scopeType "Space";
        proxy_set_header Content-Type "application/json";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # 带内容哈希的静态资源长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
